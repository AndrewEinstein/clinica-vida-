services:
  - type: web
    name: clinica-vida
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /login
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "Clinica Vida+"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: DB_SSLMODE
        value: require

      - key: RUN_MIGRATIONS
        value: "1"
